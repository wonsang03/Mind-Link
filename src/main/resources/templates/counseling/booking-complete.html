<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 예약 완료')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page-narrow" style="max-width: 36rem;">
        <div class="card center">
            <div class="icon-circle icon-circle-lg" style="margin: 0 auto 1.5rem; width: 5rem; height: 5rem;">
                <span class="icon-emoji">✓</span>
            </div>
            <h2 class="mb-4">예약 신청이 접수되었습니다</h2>
            <p class="muted mb-8">상담 센터에서 24시간 이내에 확인 후 연락드립니다.</p>

            <div style="background: var(--secondary); border-radius: 0.5rem; padding: 1.5rem; text-align: left; margin-bottom: 2rem;">
                <h4 class="mb-4">예약 정보</h4>
                <div class="muted" style="display: grid; gap: 0.5rem;">
                    <div>예약 번호: <span style="color: var(--foreground);" th:text="${'#' + booking.id}">#1</span></div>
                    <div>상담 센터: <span style="color: var(--foreground);" th:text="${booking.centerName} + (${booking.centerTitle != null and !booking.centerTitle.isEmpty()} ? ' (' + ${booking.centerTitle} + ')' : '')">마음다움 심리상담센터 (심리상담센터)</span></div>
                    <div th:if="${booking.centerAddress != null and !booking.centerAddress.isEmpty()}">센터 주소: <span style="color: var(--foreground);" th:text="${booking.centerAddress}">주소</span></div>
                    <div th:if="${booking.centerPhone != null and !booking.centerPhone.isEmpty()}">센터 연락처: <span style="color: var(--foreground);" th:text="${booking.centerPhone}">전화</span></div>
                    <div>이름: <span style="color: var(--foreground);" th:text="${booking.name}">홍길동</span></div>
                    <div>연락처: <span style="color: var(--foreground);" th:text="${booking.phone}">010-0000-0000</span></div>
                    <div>이메일: <span style="color: var(--foreground);" th:text="${booking.email}">user@example.com</span></div>
                    <div>희망 일시: <span style="color: var(--foreground);" th:text="${booking.date} + ' ' + ${booking.time}">2026-05-10 14:00</span></div>
                    <div th:if="${booking.type}">상담 유형: <span style="color: var(--foreground);" th:text="${booking.type}">초기 상담 (50분)</span></div>
                </div>
            </div>

            <div class="flex gap-4">
                <a th:href="@{/}" class="btn btn-outline" style="flex: 1;">홈으로</a>
                <a th:href="@{/counseling}" class="btn btn-primary" style="flex: 1;">목록으로</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
