<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page-form">
        <div class="center mb-8">
            <div class="badge">
                <span style="color: var(--primary);">♥</span>
                <span>Welcome Back</span>
            </div>
            <h1 style="font-size: 2.25rem;" class="mb-4">다시 만나서 반가워요</h1>
            <p class="muted">마음이음에 로그인하고 나의 케어 여정을 이어가세요.</p>
        </div>

        <div class="card">
            <form th:action="@{/login}" method="post" th:object="${loginForm}">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                    <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" th:field="*{email}"
                           class="form-input" placeholder="you@example.com" required/>
                    <div th:if="${#fields.hasErrors('email')}" class="form-error" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" th:field="*{password}"
                           class="form-input" placeholder="••••••••" required/>
                    <div th:if="${#fields.hasErrors('password')}" class="form-error" th:errors="*{password}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">로그인</button>
            </form>

            <div class="form-divider">또는</div>

            <button type="button" class="btn btn-secondary btn-block" disabled>소셜 계정으로 계속하기</button>
        </div>

        <p class="center mt-6 muted">
            아직 계정이 없으신가요?
            <a th:href="@{/signup}" style="color: var(--primary); text-decoration: underline;">회원가입</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
