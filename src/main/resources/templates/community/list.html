<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 커뮤니티')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page">
        <div class="flex-between mb-8" style="margin-bottom: 2rem; align-items: flex-start;">
            <div class="page-header" style="margin-bottom: 0;">
                <h1>커뮤니티</h1>
                <p class="muted">같은 고민을 가진 사람들과 경험을 나누고 서로를 응원해요.</p>
            </div>
            <a th:href="@{/community/new}" class="btn btn-primary" style="white-space: nowrap; flex-shrink: 0;">
                <span class="pico pico-sm" aria-hidden="true" style="color: currentColor;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </span>
                <span>글쓰기</span>
            </a>
        </div>

        <div th:if="${flash}" class="alert alert-info" th:text="${flash}"></div>

        <!-- 명언/속담 -->
        <div th:if="${proverb}" class="section-highlight"
             style="margin-bottom: 1.75rem; padding: 1.1rem 1.4rem; display:flex; align-items:flex-start; gap:0.9rem;">
            <span class="pico pico-md" aria-hidden="true" style="color:var(--primary); flex-shrink:0; margin-top:0.1rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
                    <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/>
                </svg>
            </span>
            <div>
                <p class="serif italic" style="margin:0; font-size:0.97rem; line-height:1.65;"
                   th:text="${proverb.content}">명언 내용</p>
                <p class="muted" style="margin:0.3rem 0 0; font-size:0.8rem;"
                   th:text="${proverb.source}">출처</p>
            </div>
        </div>

        <!-- C-1: 같은 정서 유형(군집)에서 많이 본 글 -->
        <div th:if="${clusterPopularPosts != null and !clusterPopularPosts.isEmpty()}"
             class="card mb-8" style="margin-bottom: 1.75rem; border: 1px solid rgba(108,92,231,0.25);">
            <h3 class="mb-2" style="font-size: 1.02rem; color: var(--primary);">나와 비슷한 분들이 많이 본 글</h3>
            <p class="muted mb-4" style="font-size: 0.82rem;">비슷한 자가진단 경향을 가진 사용자들이 공감한 게시글이에요.</p>
            <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem;">
                <li th:each="cp : ${clusterPopularPosts}" style="display: flex; justify-content: space-between; gap: 0.75rem;">
                    <a th:href="@{/community/{id}(id=${cp.id})}" th:text="${cp.title}"
                       style="color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">제목</a>
                    <span class="muted" style="flex-shrink: 0; font-size: 0.85rem;" th:text="|♥ ${cp.likes}|">♥ 0</span>
                </li>
            </ul>
        </div>

        <div class="card mb-8" style="margin-bottom: 2rem;">
            <form th:action="@{/community}" method="get" class="flex gap-4 mb-4" style="margin-bottom: 1rem; flex-wrap: wrap;">
                <input type="hidden" name="category" th:value="${selectedCategory}"/>
                <input type="hidden" name="sort" th:value="${sort}"/>
                <input type="text" name="q" th:value="${query}"
                       class="form-input" placeholder="검색어를 입력하세요..." style="flex: 1; margin: 0;"/>
                <button type="submit" class="btn btn-primary">검색</button>
            </form>

            <div class="flex-between" style="gap: 1rem; flex-wrap: wrap; align-items: center;">
                <div class="flex gap-2" style="flex-wrap: wrap;">
                    <a th:each="cat : ${categories}"
                       th:href="@{/community(category=${cat}, q=${query}, sort=${sort})}"
                       th:classappend="${cat == selectedCategory} ? 'btn-primary' : 'btn-secondary'"
                       class="btn"
                       style="padding: 0.5rem 1rem; font-size: 0.95rem;"
                       th:text="${cat}">전체</a>
                </div>
                <select class="form-input" aria-label="정렬 방식"
                        style="width: auto; padding: 0.45rem 0.8rem; font-size: 0.9rem; cursor: pointer; flex-shrink: 0;"
                        onchange="if (this.value) { location.href = this.value; }">
                    <option th:value="@{/community(category=${selectedCategory}, q=${query}, sort='popular')}"
                            th:selected="${sort == 'popular'}">인기순 (맞춤)</option>
                    <option th:value="@{/community(category=${selectedCategory}, q=${query}, sort='recent')}"
                            th:selected="${sort == 'recent'}">최신순</option>
                    <option th:value="@{/community(category=${selectedCategory}, q=${query}, sort='likes')}"
                            th:selected="${sort == 'likes'}">좋아요순</option>
                </select>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="center muted" style="padding: 3rem 0;">
            게시글이 없습니다. 첫 번째 글을 작성해보세요!
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <a th:each="p : ${posts}" th:href="@{/community/{id}(id=${p.id})}"
               class="card card-link" style="display: block;">
                <div class="flex-between mb-4" style="margin-bottom: 0.75rem;">
                    <div class="flex gap-3" style="align-items: center;">
                        <span class="tag tag-secondary" th:text="${p.category}">카테고리</span>
                        <span class="muted" style="font-size: 0.875rem;" th:text="${p.author}">작성자</span>
                    </div>
                    <span class="muted" style="font-size: 0.875rem;"
                          th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-07 14:00</span>
                </div>
                <h3 class="mb-2" th:text="${p.title}">제목</h3>
                <p class="muted mb-4" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                   th:text="${p.content}">내용</p>
                <div class="flex gap-4 muted" style="font-size: 0.95rem;">
                    <span>♥ <span th:text="${p.likes}">0</span></span>
                    <span>💬 <span th:text="${#lists.size(p.comments)}">0</span></span>
                </div>
            </a>
        </div>

        <div style="background: var(--secondary); border-radius: 0.75rem; padding: 1.5rem; margin-top: 3rem;">
            <h3 class="mb-2" style="display: flex; align-items: center; gap: 0.45rem;">
                <span class="pico pico-md" style="color: var(--primary);" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="17" x2="12" y2="22"/>
                        <path d="M9 10V2h6v8l3 3v3H6v-3z"/>
                    </svg>
                </span>
                <span>커뮤니티 안내</span>
            </h3>
            <ul class="muted" style="margin: 0; padding-left: 1.25rem;">
                <li>익명으로 안전하게 소통할 수 있습니다.</li>
                <li>부적절한 게시물은 신고 기능으로 관리됩니다.</li>
                <li>위기 상황에서는 즉시 전문가 상담을 이용해주세요.</li>
            </ul>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
