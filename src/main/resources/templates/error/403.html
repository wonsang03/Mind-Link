<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 접근 권한 없음')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="error-page">
        <div class="error-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <p class="error-code">403</p>
        <h1 class="error-title">접근 권한이 없습니다</h1>
        <p class="error-desc">이 페이지를 볼 수 있는 권한이 없습니다.<br/>
            로그인 상태나 계정 권한을 확인해 주세요.</p>
        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary">홈으로 돌아가기</a>
            <a th:href="@{/login}" class="btn btn-outline">로그인</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
