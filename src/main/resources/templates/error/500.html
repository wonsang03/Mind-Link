<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 서버 오류')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="error-page">
        <div class="error-badge is-danger" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>
        <p class="error-code is-danger">500</p>
        <h1 class="error-title">서버에 문제가 발생했습니다</h1>
        <p class="error-desc">일시적인 오류로 요청을 처리하지 못했습니다.<br/>
            잠시 후 다시 시도해 주세요. 문제가 계속되면 관리자에게 문의해 주세요.</p>
        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary">홈으로 돌아가기</a>
            <a href="javascript:location.reload()" class="btn btn-outline">새로고침</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
