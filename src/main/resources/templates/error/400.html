<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 잘못된 요청')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="error-page">
        <div class="error-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <p class="error-code">400</p>
        <h1 class="error-title">잘못된 요청입니다</h1>
        <p class="error-desc">요청 내용에 오류가 있어 처리할 수 없습니다.<br/>
            입력한 내용을 확인하고 다시 시도해 주세요.</p>
        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary">홈으로 돌아가기</a>
            <a href="javascript:history.back()" class="btn btn-outline">이전 페이지로</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
