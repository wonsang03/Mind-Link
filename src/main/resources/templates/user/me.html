<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 내 계정')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page" style="padding-top: 3rem; padding-bottom: 4rem;">

        <!-- 플래시 메시지 -->
        <div th:if="${flash}"
             style="max-width: 520px; margin: 0 auto 1.25rem;"
             class="alert alert-info">
            <span th:text="${flash}"></span>
        </div>

        <div style="max-width: 520px; margin: 0 auto;">

            <!-- ── 프로필 카드 ── -->
            <div class="profile-card">

                <!-- 히어로: 아바타 + 이름 + 이메일 + 등급 -->
                <div class="profile-hero">
                    <div class="avatar-circle avatar-xl" style="margin: 0 auto;">
                        <img th:if="${user.profileImageUrl != null}"
                             th:src="${user.profileImageUrl}" alt="프로필 사진"/>
                        <span th:if="${user.profileImageUrl == null}">👤</span>
                    </div>
                    <div class="profile-hero-name"
                         th:text="${(user.nickname != null and !#strings.isEmpty(user.nickname)) ? user.nickname : user.name}">
                        이름
                    </div>
                    <div class="profile-hero-email" th:text="${user.email}">email@example.com</div>
                    <span th:switch="${user.role.name()}">
                        <span th:case="'ADMIN'" class="tag tag-primary">관리자</span>
                        <span th:case="'COUNSELOR'" class="tag tag-secondary">상담사</span>
                        <span th:case="*" class="tag">일반 사용자</span>
                    </span>
                </div>

                <!-- ── 섹션 1: 기본 정보 ── -->
                <div class="profile-section">
                    <div class="profile-section-label">기본 정보</div>

                    <div class="profile-row">
                        <div class="profile-row-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                            </svg>
                        </div>
                        <div class="profile-row-body">
                            <div class="profile-row-label">이름</div>
                            <div class="profile-row-value" th:text="${user.name}">이름</div>
                        </div>
                    </div>

                    <div class="profile-row">
                        <div class="profile-row-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div class="profile-row-body">
                            <div class="profile-row-label">닉네임</div>
                            <div th:if="${user.nickname != null and !#strings.isEmpty(user.nickname)}"
                                 class="profile-row-value" th:text="${user.nickname}"></div>
                            <div th:unless="${user.nickname != null and !#strings.isEmpty(user.nickname)}"
                                 class="profile-row-value empty">미입력</div>
                        </div>
                    </div>

                    <div class="profile-row">
                        <div class="profile-row-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                            </svg>
                        </div>
                        <div class="profile-row-body">
                            <div class="profile-row-label">이메일</div>
                            <div class="profile-row-value" th:text="${user.email}"
                                 style="word-break: break-all;">email@example.com</div>
                        </div>
                    </div>
                </div>

                <!-- ── 섹션 2: 연락처 & 지역 ── -->
                <div class="profile-section">
                    <div class="profile-section-label">연락처 &amp; 지역</div>

                    <div class="profile-row">
                        <div class="profile-row-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.61 19a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 3.09 4.18 2 2 0 0 1 5.07 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </div>
                        <div class="profile-row-body">
                            <div class="profile-row-label">전화번호</div>
                            <div th:if="${user.phone != null and !#strings.isEmpty(user.phone)}"
                                 class="profile-row-value" th:text="${user.phone}"></div>
                            <div th:unless="${user.phone != null and !#strings.isEmpty(user.phone)}"
                                 class="profile-row-value empty">미입력</div>
                        </div>
                    </div>

                    <div class="profile-row">
                        <div class="profile-row-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>
                            </svg>
                        </div>
                        <div class="profile-row-body">
                            <div class="profile-row-label">거주 지역</div>
                            <div th:if="${user.region != null and !#strings.isEmpty(user.region)}"
                                 class="profile-row-value" th:text="${user.region}"></div>
                            <div th:unless="${user.region != null and !#strings.isEmpty(user.region)}"
                                 class="profile-row-value empty">미입력</div>
                        </div>
                    </div>

                    <div class="profile-row">
                        <div class="profile-row-icon" th:classappend="${user.notificationEnabled} ? 'notif-on' : ''">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/>
                                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                            </svg>
                        </div>
                        <div class="profile-row-body">
                            <div class="profile-row-label">알림 수신</div>
                            <div class="profile-row-value">
                                <span th:if="${user.notificationEnabled}"
                                      style="display:inline-flex;align-items:center;gap:0.35rem;color:var(--primary);font-weight:500;">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                    수신 중
                                </span>
                                <span th:unless="${user.notificationEnabled}" class="empty"
                                      style="display:inline-flex;align-items:center;gap:0.35rem;font-size:0.875rem;font-style:italic;">
                                    미수신
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── 섹션 3: 계정 정보 ── -->
                <div class="profile-section">
                    <div class="profile-section-label">계정 정보</div>

                    <div class="profile-row">
                        <div class="profile-row-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/>
                            </svg>
                        </div>
                        <div class="profile-row-body">
                            <div class="profile-row-label">계정 등급</div>
                            <div class="profile-row-value">
                                <span th:switch="${user.role.name()}">
                                    <span th:case="'ADMIN'" class="tag tag-primary">관리자</span>
                                    <span th:case="'COUNSELOR'" class="tag tag-secondary">상담사</span>
                                    <span th:case="*" class="tag">일반 사용자</span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="profile-row">
                        <div class="profile-row-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
                            </svg>
                        </div>
                        <div class="profile-row-body">
                            <div class="profile-row-label">가입일</div>
                            <div class="profile-row-value"
                                 th:text="${#temporals.format(user.createdAt, 'yyyy년 MM월 dd일')}">2026-01-01</div>
                        </div>
                    </div>
                </div>

            </div>
            <!-- /.profile-card -->

            <!-- 활동 일지 진입 -->
            <a th:href="@{/activities/history}" class="card card-link"
               style="display:flex; align-items:center; gap:0.85rem; margin-top:1.25rem; padding:1rem 1.25rem; text-decoration:none;">
                <span class="pico pico-md" style="color: var(--primary);" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                </span>
                <span style="flex:1;">
                    <span style="display:block; font-weight:600;">내 활동 일지</span>
                    <span class="muted" style="font-size:0.85rem;">수행한 추천 활동 기록을 확인해요</span>
                </span>
                <span class="pico pico-sm" style="color: var(--muted-foreground);" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 6 15 12 9 18"/>
                    </svg>
                </span>
            </a>

            <!-- 액션 버튼 -->
            <div class="profile-actions">
                <a th:href="@{/user/me/edit}" class="btn btn-primary" style="flex: 1; min-width: 120px;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/>
                    </svg>
                    회원 정보 수정
                </a>
                <form th:action="@{/logout}" method="post" style="flex: 1; min-width: 120px;">
                    <button type="submit" class="btn btn-secondary" style="width: 100%;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/>
                            <polyline points="14 17 19 12 14 7"/><line x1="19" y1="12" x2="9" y2="12"/>
                        </svg>
                        로그아웃
                    </button>
                </form>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
