<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: '마음이음'">마음이음</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<header th:fragment="header" class="header">
    <div class="header-inner">
        <a th:href="@{/}" class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </span>
            <div>
                <div class="brand-name">마음이음</div>
                <div class="brand-sub">Mind-Link</div>
            </div>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mainNav">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>
        <nav class="nav" id="mainNav">
            <a th:href="@{/notice}"
               th:classappend="${#strings.startsWith(currentUri, '/notice')} ? 'active'">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/>
                        <path d="M9 21a3 3 0 0 0 6 0"/>
                    </svg>
                </span>
                <span>공지사항</span>
            </a>
            <a th:href="@{/self-assessment}"
               th:classappend="${#strings.startsWith(currentUri, '/self-assessment')} ? 'active'">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="8" y="3" width="8" height="4" rx="1"/>
                        <path d="M8 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                        <polyline points="9 14 11 16 15 12"/>
                    </svg>
                </span>
                <span>자가진단</span>
            </a>
            <a th:href="@{/recommendations}"
               th:classappend="${#strings.startsWith(currentUri, '/recommendations')} ? 'active'">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 1 4 17.5z"/>
                        <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/>
                    </svg>
                </span>
                <span>맞춤 추천</span>
            </a>
            <a th:href="@{/care-report}"
               th:classappend="${#strings.startsWith(currentUri, '/care-report')} ? 'active'">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16v12H5.17L4 17.17z"/>
                        <line x1="8" y1="9" x2="16" y2="9"/>
                        <line x1="8" y1="13" x2="13" y2="13"/>
                    </svg>
                </span>
                <span>AI 정서 케어</span>
            </a>
            <a th:href="@{/community}"
               th:classappend="${#strings.startsWith(currentUri, '/community')} ? 'active'">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </span>
                <span>커뮤니티</span>
            </a>
            <a th:href="@{/counseling}"
               th:classappend="${#strings.startsWith(currentUri, '/counseling')} ? 'active'">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                </span>
                <span>상담소 찾기</span>
            </a>

            <th:block th:if="${loginUser != null}">
                <a th:href="@{/alerts}" class="nav-alert-link btn-outline nav-cta"
                   th:classappend="${#strings.startsWith(currentUri, '/alerts')} ? 'active'"
                   th:aria-label="${unreadAlertCount > 0} ? |알림, 읽지 않음 ${unreadAlertCount}건| : '알림'"
                   title="알림">
                    <span class="nav-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/>
                            <path d="M9 21a3 3 0 0 0 6 0"/>
                        </svg>
                    </span>
                    <span th:if="${unreadAlertCount > 0}" class="alert-badge" th:text="${unreadAlertCount}">0</span>
                </a>
                <a th:href="@{/user/me}" class="btn-outline nav-cta"
                   th:classappend="${currentUri == '/user/me'} ? 'active'">
                    <span class="nav-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                        </svg>
                    </span>
                    <span>내 정보</span>
                </a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-outline nav-cta">
                        <span class="nav-ico" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/>
                                <polyline points="14 17 19 12 14 7"/>
                                <line x1="19" y1="12" x2="9" y2="12"/>
                            </svg>
                        </span>
                        <span>로그아웃</span>
                    </button>
                </form>
            </th:block>
            <a th:if="${loginUser == null}" th:href="@{/login}"
               class="btn-outline nav-cta"
               th:classappend="${currentUri == '/login'} ? 'active'">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                </span>
                <span>로그인</span>
            </a>
        </nav>
    </div>
</header>

<footer th:fragment="footer">
    <div class="footer-inner">
        <div class="footer-grid">
            <div>
                <div class="brand mb-4">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </span>
                    <span>마음이음</span>
                </div>
                <p class="muted">당신의 마음 건강을 위한<br/>든든한 파트너</p>
            </div>
            <div>
                <h4 class="mb-4">서비스</h4>
                <ul>
                    <li><a th:href="@{/self-assessment}">자가진단</a></li>
                    <li><a th:href="@{/recommendations}">맞춤 추천</a></li>
                    <li><a th:href="@{/care-report}">AI 정서 케어</a></li>
                    <li><a th:href="@{/counseling}">상담소 찾기</a></li>
                    <li th:if="${loginUser != null}"><a th:href="@{/alerts}">알림</a></li>
                </ul>
            </div>
            <div>
                <h4 class="mb-4">지원</h4>
                <ul>
                    <li><a th:href="@{/notice}">공지사항</a></li>
                    <li><a href="javascript:void(0);" onclick="openUserGuide()">이용 가이드</a></li>
                    <li><a href="#">문의하기</a></li>
                </ul>
            </div>
            <div>
                <h4 class="mb-4">긴급 연락처</h4>
                <ul>
                    <li>자살예방상담: 1393</li>
                    <li>정신건강위기상담: 1577-0199</li>
                    <li>청소년상담: 1388</li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            © 2026 Mind-Link. 당신의 마음 건강을 응원합니다.
        </div>
    </div>

    <!-- 이용 가이드 모달 -->
    <div id="userGuideOverlay" class="guide-overlay" onclick="handleGuideOverlayClick(event)">
        <div class="guide-modal" role="dialog" aria-modal="true" aria-labelledby="guideModalTitle">
            <div class="guide-modal-head">
                <button class="guide-back" id="guideBackBtn" onclick="showGuideList()" style="display:none;" aria-label="목록으로">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <h2 id="guideModalTitle">이용 가이드</h2>
                <button class="guide-close" onclick="closeUserGuide()" aria-label="닫기">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="guide-body" id="guideBody">
                <ul class="guide-list" id="guideListPanel"></ul>
                <div class="guide-detail" id="guideDetailPanel" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        var btn = document.getElementById('navToggle');
        var nav = document.getElementById('mainNav');
        if (!btn || !nav) return;
        btn.addEventListener('click', function () {
            var open = nav.classList.toggle('open');
            btn.setAttribute('aria-expanded', String(open));
        });
        document.addEventListener('click', function (e) {
            if (!btn.contains(e.target) && !nav.contains(e.target)) {
                nav.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            }
        });
    })();

                '솔직하게 답할수록 더 정확한 결과를 얻을 수 있어요.',

            desc: '공지사항에서는 마음이음 서비스의 새로운 기능 업데이트, 이벤트, 서비스 점검 일정 등 중요한 안내를 확인할 수 있습니다.',

                '상단 메뉴에서 <strong>공지사항</strong>을 클릭합니다.',

                '공지 상세 내용을 확인합니다.'
            ],
            tips: [
                '중요 공지사항은 목록 상단에 고정됩니다.',
                '서비스 점검 일정을 미리 확인하여 이용에 불편함이 없도록 해보세요.'
            ]
        }
    ];

    function openUserGuide() {
        var overlay = document.getElementById('userGuideOverlay');
        renderGuideList();
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        document.addEventListener('keydown', handleGuideEsc);
    }

    function closeUserGuide() {
        var overlay = document.getElementById('userGuideOverlay');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
        document.removeEventListener('keydown', handleGuideEsc);
    }

    function handleGuideEsc(e) {
        if (e.key === 'Escape') closeUserGuide();
    }

    function handleGuideOverlayClick(e) {
        if (e.target === document.getElementById('userGuideOverlay')) closeUserGuide();
    }

    function renderGuideList() {
        var list = document.getElementById('guideListPanel');
        var detail = document.getElementById('guideDetailPanel');
        var backBtn = document.getElementById('guideBackBtn');
        var title = document.getElementById('guideModalTitle');

        list.style.display = '';
        detail.style.display = 'none';
        backBtn.style.display = 'none';
        title.textContent = '이용 가이드';

        list.innerHTML = guideData.map(function(item, i) {
            return '<li class="guide-list-item" onclick="showGuideDetail(' + i + ')" tabindex="0" onkeydown="if(event.key===\'Enter\')showGuideDetail(' + i + ')">' +
                '<span class="guide-list-icon">' + item.icon + '</span>' +
                '<span class="guide-list-text"><strong>' + item.title + '</strong><span>' + item.summary + '</span></span>' +
                '<span class="guide-list-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>' +
                '</li>';
        }).join('');
    }

    function showGuideDetail(index) {
        var item = guideData[index];
        var list = document.getElementById('guideListPanel');
        var detail = document.getElementById('guideDetailPanel');
        var backBtn = document.getElementById('guideBackBtn');
        var title = document.getElementById('guideModalTitle');

        list.style.display = 'none';
        detail.style.display = '';
        backBtn.style.display = '';
        title.textContent = item.title;

        var stepsHtml = item.steps.map(function(step, i) {
            return '<li><span class="guide-step-num">' + (i + 1) + '</span><span>' + step + '</span></li>';
        }).join('');

        var tipsHtml = item.tips.map(function(tip) {
            return '<li>' + tip + '</li>';
        }).join('');

        detail.innerHTML =
            '<p class="guide-detail-desc">' + item.desc + '</p>' +
            '<h3>이용 방법</h3>' +
            '<ul class="guide-steps">' + stepsHtml + '</ul>' +
            '<div class="guide-tips"><h3>이용 팁</h3><ul>' + tipsHtml + '</ul></div>';

        document.getElementById('guideBody').scrollTop = 0;
    }

    function showGuideList() {
        renderGuideList();
        document.getElementById('guideBody').scrollTop = 0;
    }
    </script>
</footer>
</body>
</html>
