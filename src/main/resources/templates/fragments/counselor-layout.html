<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: '마음이음 상담사'">마음이음 상담사</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>

<aside th:fragment="sidebar(active)" class="admin-sidebar counselor-sidebar">
    <div class="admin-brand">
        <a th:href="@{/counselor}" class="admin-brand-link">
            <span class="admin-brand-icon counselor-brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </span>
            <div>
                <div class="admin-brand-name">마음이음</div>
                <div class="admin-brand-sub counselor-brand-sub">상담사</div>
            </div>
        </a>
    </div>

    <nav class="admin-nav">
        <!-- 대시보드 -->
        <a th:href="@{/counselor}" class="admin-nav-item"
           th:classappend="${active == 'dashboard'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
            </span>
            <span>대시보드</span>
        </a>

        <!-- 게시글 관리 -->
        <a th:href="@{/counselor/posts}" class="admin-nav-item"
           th:classappend="${active == 'posts'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16v12H5.17L4 17.17z"/>
                    <line x1="8" y1="9" x2="16" y2="9"/>
                    <line x1="8" y1="13" x2="13" y2="13"/>
                </svg>
            </span>
            <span>게시글 관리</span>
        </a>

        <!-- 예약 관리 -->
        <a th:href="@{/counselor/bookings}" class="admin-nav-item"
           th:classappend="${active == 'bookings'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M16 2v4M8 2v4M3 10h18"/>
                </svg>
            </span>
            <span>예약 관리</span>
        </a>

        <!-- 고위험도 관리 -->
        <a th:href="@{/counselor/high-risk}" class="admin-nav-item counselor-nav-danger"
           th:classappend="${active == 'high-risk'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </span>
            <span>고위험도 관리</span>
            <span class="admin-nav-badge"
                  th:if="${unconfirmedHighRiskCount != null and unconfirmedHighRiskCount > 0}"
                  th:text="${unconfirmedHighRiskCount}"></span>
        </a>

        <!-- 알림 발송 -->
        <a th:href="@{/counselor/alerts}" class="admin-nav-item"
           th:classappend="${active == 'alerts'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
            </span>
            <span>알림 발송</span>
        </a>
    </nav>

    <div class="admin-sidebar-footer">
        <a th:href="@{/}" class="admin-back-link">← 일반 사이트로</a>
    </div>
</aside>

</body>
</html>
