<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: '마음이음 관리자'">마음이음 관리자</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>

<aside th:fragment="sidebar(active)" class="admin-sidebar">
    <div class="admin-brand">
        <a th:href="@{/admin}" class="admin-brand-link">
            <span class="admin-brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </span>
            <div>
                <div class="admin-brand-name">마음이음</div>
                <div class="admin-brand-sub">관리자</div>
            </div>
        </a>
    </div>
    <nav class="admin-nav">
        <a th:href="@{/admin}" class="admin-nav-item"
           th:classappend="${active == 'dashboard'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                </svg>
            </span>
            <span>대시보드</span>
        </a>
        <a th:href="@{/admin/monitoring}" class="admin-nav-item"
           th:classappend="${active == 'monitoring'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
            </span>
            <span>모니터링</span>
            <span class="admin-nav-badge"
                  th:if="${unconfirmedHighRiskCount != null and unconfirmedHighRiskCount > 0}"
                  th:text="${unconfirmedHighRiskCount}"></span>
        </a>
        <a th:href="@{/admin/cluster}" class="admin-nav-item"
           th:classappend="${active == 'cluster'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="6" cy="6" r="2"/><circle cx="18" cy="7" r="2"/>
                    <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
                    <circle cx="12" cy="12" r="2"/>
                    <path d="M8 7l3 4M16 8l-4 4M9 16l3-4M15 16l-3-4"/>
                </svg>
            </span>
            <span>정서 클러스터</span>
        </a>
        <a th:href="@{/admin/users}" class="admin-nav-item"
           th:classappend="${active == 'users'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </span>
            <span>유저 관리</span>
        </a>
        <a th:href="@{/admin/posts}" class="admin-nav-item"
           th:classappend="${active == 'posts'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16v12H5.17L4 17.17z"/>
                    <line x1="8" y1="9" x2="16" y2="9"/>
                    <line x1="8" y1="13" x2="13" y2="13"/>
                </svg>
            </span>
            <span>게시글 관리</span>
        </a>
        <a th:href="@{/admin/notices}" class="admin-nav-item"
           th:classappend="${active == 'notice'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/>
                    <path d="M9 21a3 3 0 0 0 6 0"/>
                </svg>
            </span>
            <span>공지 관리</span>
        </a>
        <a th:href="@{/admin/alerts}" class="admin-nav-item"
           th:classappend="${active == 'alerts'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
            </span>
            <span>알림 발송</span>
        </a>
        <a th:href="@{/admin/sql}" class="admin-nav-item"
           th:classappend="${active == 'sql'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </svg>
            </span>
            <span>SQL 콘솔</span>
        </a>
        <a th:href="@{/admin/logs}" class="admin-nav-item"
           th:classappend="${active == 'logs'} ? 'active'">
            <span class="admin-nav-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="8" y1="13" x2="16" y2="13"/>
                    <line x1="8" y1="17" x2="16" y2="17"/>
                    <line x1="8" y1="9"  x2="10" y2="9"/>
                </svg>
            </span>
            <span>서버 로그</span>
        </a>
    </nav>
    <div class="admin-sidebar-footer">
        <a th:href="@{/}" class="admin-back-link">← 일반 사이트로</a>
    </div>
</aside>

<div th:fragment="admin-layout" class="admin-layout">

    <!-- 사이드바 -->
    <aside class="admin-sidebar">
        <div class="admin-brand">
            <a th:href="@{/admin}" class="admin-brand-link">
                <span class="admin-brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </span>
                <div>
                    <div class="admin-brand-name">마음이음</div>
                    <div class="admin-brand-sub">관리자</div>
                </div>
            </a>
        </div>

        <nav class="admin-nav">
            <a th:href="@{/admin}" class="admin-nav-item"
               th:classappend="${currentUri == '/admin' or currentUri == '/admin/'} ? 'active'">
                <span class="admin-nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                </span>
                <span>대시보드</span>
            </a>

            <a th:href="@{/admin/monitoring}" class="admin-nav-item"
               th:classappend="${currentUri == '/admin/monitoring'} ? 'active'">
                <span class="admin-nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                         stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                </span>
                <span>모니터링</span>
                <span class="admin-nav-badge"
                      th:if="${unconfirmedHighRiskCount != null and unconfirmedHighRiskCount > 0}"
                      th:text="${unconfirmedHighRiskCount}"></span>
            </a>

            <a th:href="@{/admin/cluster}" class="admin-nav-item"
               th:classappend="${currentUri == '/admin/cluster'} ? 'active'">
                <span class="admin-nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="6" cy="6" r="2"/>
                        <circle cx="18" cy="7" r="2"/>
                        <circle cx="7" cy="17" r="2"/>
                        <circle cx="17" cy="17" r="2"/>
                        <circle cx="12" cy="12" r="2"/>
                        <path d="M8 7l3 4M16 8l-4 4M9 16l3-4M15 16l-3-4"/>
                    </svg>
                </span>
                <span>정서 클러스터</span>
            </a>

            <a th:href="@{/notice/new}" class="admin-nav-item"
               th:classappend="${#strings.startsWith(currentUri, '/notice')} ? 'active'">
                <span class="admin-nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/>
                        <path d="M9 21a3 3 0 0 0 6 0"/>
                    </svg>
                </span>
                <span>공지 관리</span>
            </a>
        </nav>

        <div class="admin-sidebar-footer">
            <a th:href="@{/}" class="admin-back-link">← 일반 사이트로</a>
        </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="admin-main">
        <div th:replace="${content}"></div>
    </div>
</div>

</body>
</html>
