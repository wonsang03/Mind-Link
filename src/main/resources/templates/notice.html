<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 공지사항')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page-narrow">
        <div class="mb-8" style="margin-bottom: 2rem;">
            <div class="flex-between" style="align-items: flex-end; flex-wrap: wrap; gap: 0.75rem;">
                <div class="page-header" style="margin-bottom: 0;">
                    <h1>공지사항</h1>
                    <p class="muted">마음이음의 업데이트와 안내 사항을 확인하세요.</p>
                </div>
                <a th:if="${loginUser != null and loginUser.role.name() == 'ADMIN'}"
                   th:href="@{/notice/new}" class="btn btn-primary" style="white-space: nowrap;">
                    공지 작성
                </a>
            </div>
        </div>

        <div th:if="${flash}" style="padding: 0.9rem 1.25rem; margin-bottom: 1.25rem; background: var(--secondary); border-radius: 0.5rem; font-size: 0.9rem;" th:text="${flash}"></div>

        <div th:if="${#lists.isEmpty(notices)}" class="center muted" style="padding: 4rem 0;">
            등록된 공지사항이 없습니다.
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <a th:each="n : ${notices}"
               th:href="@{/notice/{id}(id=${n.id})}"
               class="card card-link" style="display: block;">
                <div class="flex-between mb-2">
                    <span class="tag tag-secondary" th:text="${n.category}">중요</span>
                    <span class="muted" style="font-size: 0.85rem;"
                          th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd')}">2026-05-10</span>
                </div>
                <h3 class="mb-2" th:text="${n.title}">공지 제목</h3>
                <p class="muted" th:text="${n.summary}">요약</p>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
