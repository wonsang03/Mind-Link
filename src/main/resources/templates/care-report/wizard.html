<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - AI 정서 케어')}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <!-- 기존에 받은 편지가 있으면 목록 바로가기 -->
    <div th:if="${reportCount != null and reportCount > 0}"
         style="max-width: 640px; margin: 1.25rem auto -0.25rem; padding: 0 1.5rem; text-align: right;">
        <a th:href="@{/care-report/list}" class="btn btn-secondary" style="font-size: 0.85rem;">
            내가 받은 편지 보기 <span th:text="|(${reportCount})|">(0)</span>
        </a>
    </div>
    <section class="cr-stage">
        <div class="cr-card" role="dialog" aria-labelledby="cr-title" aria-live="polite">
            <div class="cr-progress">
                <div class="cr-progress-meta">
                    <span id="cr-step-label">1 / 10 단계</span>
                    <span id="cr-percent">10%</span>
                </div>
                <div class="cr-progress-bar"><div id="cr-progress-fill" class="cr-progress-fill"></div></div>
            </div>

            <!-- 동적으로 갈아끼우는 본문 -->
            <div id="cr-step" class="cr-step-body"></div>

            <div class="cr-error" id="cr-error" role="alert"></div>

            <div class="cr-nav">
                <button type="button" id="cr-prev" class="btn btn-secondary">이전</button>
                <button type="button" id="cr-skip" class="btn btn-ghost" style="display:none;">건너뛰기</button>
                <button type="button" id="cr-next" class="btn btn-primary">다음</button>
            </div>

            <p class="cr-footnote">
                본 보고서는 참고용이며 전문 상담을 대체하지 않습니다.
                위기 시 1393 · 1577-0199 · 119.
            </p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
/*<![CDATA[*/
(function() {
    const ASSESSMENTS = JSON.parse(/*[[${assessmentsJson}]]*/ '[]');
    const USER_NAME = /*[[${userName}]]*/ '당신';

    const byType = {};
    if (Array.isArray(ASSESSMENTS)) {
        ASSESSMENTS.forEach(a => { if (a && a.typeKey) byType[a.typeKey] = a; });
    }

    const state = {
        step: 1,
        mood: '',
        recentHardship: '',
        concern: '',
        smallComfort: '',
        hopeForward: '',
        oneLineMessage: '',
        answers: { stress: [], depression: [], anxiety: [] }
    };

    const BASE_STEPS = [
        { kind: 'welcome' },
        { kind: 'text', key: 'mood', required: true,
          title: '오늘의 기분',
          placeholder: '예: 무기력하고 아무것도 하기 싫어요',
          helper: '지금 마음을 한두 문장으로 적어 주세요.' },
        { kind: 'assess', typeKey: 'stress' },
        { kind: 'text', key: 'recentHardship', required: true,
          title: '최근 가장 힘든 일',
          placeholder: '예: 이번 주 시험 준비가 잘 안 돼요',
          helper: '가장 부담이 됐던 사실 하나만 적어도 됩니다.' },
        { kind: 'assess', typeKey: 'depression' },
        { kind: 'text', key: 'concern', required: true,
          title: '요즘 가장 큰 고민',
          placeholder: '예: 앞으로 진로가 막막해요',
          helper: '머릿속을 자주 채우는 걱정을 적어 주세요.' },
        { kind: 'text', key: 'smallComfort', required: true,
          title: '잠깐이라도 위로가 됐던 순간',
          placeholder: '예: 친구가 카톡으로 안부를 물어봐 줬어요',
          helper: '아주 작은 일이라도 괜찮아요. 그때의 느낌을 적어 주세요.' },
        { kind: 'assess', typeKey: 'anxiety' },
        { kind: 'text', key: 'hopeForward', required: true,
          title: '앞으로 바라는 한 가지',
          placeholder: '예: 이번 주말엔 충분히 쉬고 싶어요',
          helper: '크지 않아도 좋아요. 지금 마음이 가는 방향을 적어 주세요.' },
        { kind: 'text', key: 'oneLineMessage', required: false,
          title: '지금 한 마디 (선택)',
          placeholder: '예: 내일은 조금 나아지길 바라요',
          helper: '편지 마무리 톤을 위한 한 줄. 비워 두셔도 됩니다.' },
        { kind: 'summary' },
        { kind: 'result' }
    ];

    const STEPS = BASE_STEPS.filter(s => s.kind !== 'assess' || !!byType[s.typeKey]);
    const TOTAL = STEPS.length;

    const $step = document.getElementById('cr-step');
    const $err = document.getElementById('cr-error');
    const $prev = document.getElementById('cr-prev');
    const $next = document.getElementById('cr-next');
    const $skip = document.getElementById('cr-skip');
    const $label = document.getElementById('cr-step-label');
    const $percent = document.getElementById('cr-percent');
    const $fill = document.getElementById('cr-progress-fill');

    function clearError() { $err.textContent = ''; $err.style.display = 'none'; }
    function showError(msg) { $err.textContent = msg; $err.style.display = 'block'; }
    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function render() {
        clearError();
        const s = STEPS[state.step - 1];
        $label.textContent = state.step + ' / ' + TOTAL + ' 단계';
        const pct = Math.round((state.step / TOTAL) * 100);
        $percent.textContent = pct + '%';
        $fill.style.width = pct + '%';

        $prev.style.display = state.step === 1 || state.step === TOTAL ? 'none' : 'inline-flex';
        $skip.style.display = 'none';

        if (s.kind === 'welcome') {
            $next.textContent = '시작하기';
            renderWelcome();
        } else if (s.kind === 'text') {
            $next.textContent = '다음';
            if (!s.required) $skip.style.display = 'inline-flex';
            renderTextInput(s);
        } else if (s.kind === 'assess') {
            $next.textContent = '다음';
            $skip.style.display = 'inline-flex';
            $skip.textContent = '건너뛰기';
            renderAssessment(s.typeKey);
        } else if (s.kind === 'summary') {
            $next.textContent = '편지 받기';
            renderSummary();
        } else if (s.kind === 'result') {
            $prev.style.display = 'none';
            $next.style.display = 'none';
            renderResult();
        }
        $step.classList.remove('cr-fade-in');
        // restart transition
        void $step.offsetWidth;
        $step.classList.add('cr-fade-in');
    }

    function renderWelcome() {
        $step.innerHTML =
            '<div class="cr-eyebrow">AI 정서 케어</div>' +
            '<h2 id="cr-title">' + escapeHtml(USER_NAME) + '님께 보내는 위로 편지</h2>' +
            '<p class="muted">총 ' + TOTAL + '단계를 마치면 AI 가 당신만을 위한 장문 위로 편지를 작성해 드립니다.</p>' +
            '<ul class="cr-bullets">' +
            '  <li><strong>필수</strong> 기분 → 힘든 일 → 고민 → 위로 순간 → 바라는 것 (중간에 자가진단 선택)</li>' +
            '  <li><strong>선택</strong> 한 마디 · 스트레스·우울·불안 검사(건너뛰기 가능)</li>' +
            '  <li>완료 후 PDF 로 저장할 수 있어요</li>' +
            '</ul>' +
            '<p class="cr-note">자해·자살 관련 표현은 안전 안내(1393)로 자동 대체되며, 본 편지는 의료적 진단이 아닙니다.</p>';
    }

    function renderTextInput(s) {
        const val = state[s.key] || '';
        $step.innerHTML =
            '<div class="cr-eyebrow">' + (s.required ? '필수 입력' : '선택 입력') + '</div>' +
            '<h2 id="cr-title">' + escapeHtml(s.title) + '</h2>' +
            '<p class="muted">' + escapeHtml(s.helper) + '</p>' +
            '<textarea id="cr-text" class="form-input cr-textarea" rows="4" maxlength="500" ' +
            'placeholder="' + escapeHtml(s.placeholder) + '">' + escapeHtml(val) + '</textarea>';
        const $ta = document.getElementById('cr-text');
        $ta.focus();
        $ta.addEventListener('input', () => { state[s.key] = $ta.value.trim(); clearError(); });
    }

    function ensureDenseAnswers(typeKey) {
        const a = byType[typeKey];
        const dense = new Array(a.questions.length).fill(null);
        const src = state.answers[typeKey] || [];
        for (let i = 0; i < a.questions.length; i++) {
            if (src[i] != null && !isNaN(src[i])) dense[i] = src[i];
        }
        state.answers[typeKey] = dense;
        return dense;
    }

    function isAssessmentComplete(typeKey) {
        const a = byType[typeKey];
        if (!a) return false;
        const answers = ensureDenseAnswers(typeKey);
        for (let i = 0; i < a.questions.length; i++) {
            if (answers[i] == null || isNaN(answers[i])) return false;
        }
        return true;
    }

    function buildAssessmentsPayload() {
        const out = {};
        ['stress', 'depression', 'anxiety'].forEach(key => {
            if (!byType[key] || !isAssessmentComplete(key)) return;
            out[key] = ensureDenseAnswers(key);
        });
        return out;
    }

    function renderAssessment(typeKey) {
        const a = byType[typeKey];
        const userAnswers = ensureDenseAnswers(typeKey);
        let html =
            '<div class="cr-eyebrow">선택 · 자가진단</div>' +
            '<h2 id="cr-title">' + escapeHtml(a.name) + '</h2>' +
            '<p class="muted">' + escapeHtml(a.description || '') + '</p>' +
            '<p class="cr-note">모든 문항에 답하지 않아도 됩니다. 「건너뛰기」로 넘어가세요.</p>' +
            '<div class="cr-quiz">';
        a.questions.forEach((q, qi) => {
            html += '<div class="cr-quiz-item" data-q="' + qi + '">' +
                '<div class="cr-quiz-q"><strong>' + (qi + 1) + '.</strong> ' + escapeHtml(q.content) + '</div>' +
                '<div class="cr-quiz-choices">';
            a.choices.forEach((c, ci) => {
                const checked = userAnswers[qi] === ci ? ' checked' : '';
                html += '<label class="cr-choice">' +
                    '<input type="radio" name="q_' + typeKey + '_' + qi + '" value="' + ci + '"' + checked + '>' +
                    '<span>' + escapeHtml(c.label) + '</span>' +
                    '</label>';
            });
            html += '</div></div>';
        });
        html += '</div>';
        $step.innerHTML = html;
        $step.querySelectorAll('input[type=radio]').forEach(el => {
            el.addEventListener('change', () => {
                const item = el.closest('.cr-quiz-item');
                const qi = parseInt(item.getAttribute('data-q'), 10);
                if (!Array.isArray(state.answers[typeKey])) state.answers[typeKey] = [];
                state.answers[typeKey][qi] = parseInt(el.value, 10);
                clearError();
            });
        });
    }

    function renderSummary() {
        const stress = summarizeAssessment('stress');
        const dep = summarizeAssessment('depression');
        const anx = summarizeAssessment('anxiety');
        $step.innerHTML =
            '<div class="cr-eyebrow">입력 요약</div>' +
            '<h2 id="cr-title">이 내용으로 편지를 씁니다</h2>' +
            '<p class="muted">수정이 필요하면 「이전」으로 돌아가 주세요.</p>' +
            '<dl class="cr-summary">' +
            row('오늘의 기분', state.mood) +
            row('최근 가장 힘든 일', state.recentHardship) +
            row('요즘 가장 큰 고민', state.concern) +
            row('위로가 됐던 순간', state.smallComfort) +
            row('앞으로 바라는 것', state.hopeForward) +
            row('지금 한 마디 (선택)', state.oneLineMessage || '(생략)') +
            (byType.stress ? row('스트레스 자가진단', stress) : '') +
            (byType.depression ? row('우울 자가진단', dep) : '') +
            (byType.anxiety ? row('불안 자가진단', anx) : '') +
            '</dl>';

        function row(k, v) {
            return '<div class="cr-summary-row">' +
                '<dt>' + escapeHtml(k) + '</dt>' +
                '<dd>' + escapeHtml(v || '(미입력)') + '</dd></div>';
        }
    }

    function summarizeAssessment(typeKey) {
        const a = byType[typeKey];
        const answers = ensureDenseAnswers(typeKey);
        for (let i = 0; i < a.questions.length; i++) {
            if (answers[i] == null || isNaN(answers[i])) return '미완료';
        }
        return '완료 (' + a.questions.length + '문항)';
    }

    function renderResult() {
        $step.innerHTML =
            '<div class="cr-eyebrow">생성 중</div>' +
            '<h2 id="cr-title">AI 가 편지를 작성하고 있어요</h2>' +
            '<p class="muted">최대 30초 정도 걸려요. 잠시만 기다려 주세요.</p>' +
            '<div class="cr-loader" aria-hidden="true"><span></span><span></span><span></span></div>';
        submit();
    }

    function validateCurrent() {
        const s = STEPS[state.step - 1];
        if (s.kind === 'text') {
            const ta = document.getElementById('cr-text');
            if (ta) state[s.key] = ta.value.trim();
            if (s.required && (!state[s.key] || state[s.key].length < 2)) {
                showError('두 글자 이상 입력해 주세요.');
                return false;
            }
        }
        return true;
    }

    async function submit() {
        const payload = {
            mood: state.mood,
            recentHardship: state.recentHardship,
            concern: state.concern,
            smallComfort: state.smallComfort,
            hopeForward: state.hopeForward,
            oneLineMessage: state.oneLineMessage,
            assessments: buildAssessmentsPayload()
        };
        try {
            const resp = await fetch('/api/care-reports/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (resp.status === 401) { window.location.href = '/login'; return; }
            if (!resp.ok) {
                let msg = '보고서를 생성하지 못했어요. 잠시 후 다시 시도해 주세요.';
                try { const d = await resp.json(); if (d && d.error) msg = d.error; } catch (e) {}
                throw new Error(msg);
            }
            const data = await resp.json();
            window.location.href = '/care-report/' + data.id;
        } catch (err) {
            $step.innerHTML =
                '<div class="cr-eyebrow" style="color: var(--destructive);">생성 실패</div>' +
                '<h2 id="cr-title">잠시 후 다시 시도해 주세요</h2>' +
                '<p class="muted">' + escapeHtml(err.message || '알 수 없는 오류') + '</p>' +
                '<button id="cr-retry" class="btn btn-primary" style="margin-top: 1rem;">처음으로 돌아가기</button>';
            document.getElementById('cr-retry').addEventListener('click', () => {
                state.step = 1; render();
            });
        }
    }

    $prev.addEventListener('click', () => {
        if (state.step > 1) { state.step--; render(); }
    });
    $next.addEventListener('click', () => {
        if (!validateCurrent()) return;
        if (state.step < TOTAL) { state.step++; render(); }
    });
    $skip.addEventListener('click', () => {
        const s = STEPS[state.step - 1];
        if (s.kind === 'text' && !s.required) state[s.key] = '';
        if (s.kind === 'assess') state.answers[s.typeKey] = [];
        if (state.step < TOTAL) { state.step++; render(); }
    });

    render();
})();
/*]]>*/
</script>

<style>
.cr-stage {
    max-width: 1280px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
    display: flex;
    justify-content: center;
}
.cr-card {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 2rem 2rem 1.5rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
}
.cr-progress { display: flex; flex-direction: column; gap: 0.45rem; }
.cr-progress-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.85rem; color: var(--muted-foreground);
}
.cr-progress-bar {
    width: 100%; height: 6px;
    background: var(--muted); border-radius: 999px; overflow: hidden;
}
.cr-progress-fill {
    height: 100%; width: 10%;
    background: var(--primary);
    transition: width 0.35s ease;
    border-radius: 999px;
}

.cr-step-body { min-height: 260px; }
.cr-fade-in {
    animation: crFadeIn 0.28s ease;
}
@keyframes crFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
}

.cr-eyebrow {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--primary);
    background: var(--secondary);
    padding: 0.2rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 0.6rem;
}
.cr-card h2 { margin: 0.1rem 0 0.5rem; font-size: 1.45rem; }
.cr-bullets { margin: 0.5rem 0 0; padding-left: 1.2rem; line-height: 1.85; color: var(--foreground); }
.cr-note {
    background: var(--secondary);
    border-radius: 0.5rem;
    padding: 0.7rem 0.9rem;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--muted-foreground);
}

.cr-textarea {
    width: 100%;
    margin-top: 0.7rem;
    font-family: inherit;
    resize: vertical;
    min-height: 110px;
}

.cr-quiz {
    margin-top: 1rem;
    display: flex; flex-direction: column; gap: 1rem;
    max-height: 50vh; overflow-y: auto;
    padding-right: 0.25rem;
}
.cr-quiz-item {
    background: var(--muted);
    border-radius: 0.6rem;
    padding: 0.85rem 1rem;
}
.cr-quiz-q { margin-bottom: 0.55rem; line-height: 1.5; }
.cr-quiz-choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.4rem;
}
.cr-choice {
    display: flex; align-items: center; gap: 0.45rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.45rem;
    padding: 0.45rem 0.6rem;
    cursor: pointer;
    font-size: 0.92rem;
    transition: background 0.15s, border-color 0.15s;
}
.cr-choice:hover { border-color: var(--primary); }
.cr-choice input { accent-color: var(--primary); }
.cr-choice input:checked + span { color: var(--primary); font-weight: 600; }

.cr-summary {
    margin: 0.5rem 0 0;
    display: flex; flex-direction: column; gap: 0.5rem;
}
.cr-summary-row {
    display: grid;
    grid-template-columns: 9.5rem 1fr;
    gap: 0.6rem;
    align-items: start;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
}
.cr-summary-row:last-child { border-bottom: 0; }
.cr-summary-row dt { color: var(--muted-foreground); font-size: 0.88rem; margin: 0; }
.cr-summary-row dd { margin: 0; white-space: pre-wrap; }

.cr-error {
    display: none;
    background: #fff3f3;
    border: 1px solid var(--destructive);
    color: var(--destructive);
    padding: 0.55rem 0.8rem;
    border-radius: 0.45rem;
    font-size: 0.9rem;
}

.cr-nav {
    display: flex; justify-content: space-between; align-items: center;
    gap: 0.5rem; margin-top: 0.4rem;
}
.cr-nav .btn-ghost {
    background: transparent;
    color: var(--muted-foreground);
    border: 1px solid transparent;
    padding: 0.45rem 0.9rem;
    border-radius: 0.4rem;
    cursor: pointer;
    font-family: inherit; font-size: 0.95rem;
}
.cr-nav .btn-ghost:hover { color: var(--primary); }

.cr-footnote {
    margin: 0.4rem 0 0;
    text-align: center;
    color: var(--muted-foreground);
    font-size: 0.78rem;
}

.cr-loader {
    display: flex; justify-content: center; gap: 0.5rem;
    margin-top: 1.4rem;
}
.cr-loader span {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--primary);
    animation: crBounce 1.2s infinite ease-in-out;
}
.cr-loader span:nth-child(2) { animation-delay: 0.15s; }
.cr-loader span:nth-child(3) { animation-delay: 0.3s; }
@keyframes crBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40%           { transform: scale(1);   opacity: 1;   }
}

@media (max-width: 640px) {
    .cr-card { padding: 1.5rem 1.2rem 1.2rem; max-width: 100%; }
    .cr-card h2 { font-size: 1.25rem; }
    .cr-summary-row { grid-template-columns: 1fr; gap: 0.1rem; }
    .cr-quiz-choices { grid-template-columns: 1fr 1fr; }
}
</style>
</body>
</html>
