<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 진단 결과')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page-narrow" style="max-width: 48rem;">
        <div class="card">
            <div class="center mb-8">
                <div class="icon-circle icon-circle-lg" style="margin: 0 auto 1rem; width: 5rem; height: 5rem;">
                    <span class="icon-emoji">✓</span>
                </div>
                <h2 class="mb-4">검사 완료</h2>
                <p class="muted" th:text="${test.title}">검사 제목</p>
            </div>

            <div style="background: var(--secondary); border-radius: 0.75rem; padding: 2rem; margin-bottom: 2rem; text-align: center;">
                <div class="muted mb-2">총점</div>
                <div style="font-size: 4rem; color: var(--primary); margin-bottom: 1rem;" th:text="${score}">15</div>
                <div style="font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--primary);" th:text="${level}">정상</div>
                <p class="muted" th:text="${message}">메시지</p>
            </div>

            <div class="mb-8">
                <h3 class="mb-4">추천 사항</h3>

                <div th:if="${highRisk}" class="alert alert-error mb-4">
                    <h4 class="mb-2">⚠ 전문가 상담 권장</h4>
                    <p class="mb-4">현재 상태에서는 전문가의 도움을 받는 것이 좋습니다.</p>
                    <a th:href="@{/counseling}" style="color: var(--destructive); text-decoration: underline;">
                        상담 예약하기 →
                    </a>
                </div>

                <div class="alert alert-info mb-4">
                    <h4 class="mb-2">🤖 AI 정서 케어</h4>
                    <p class="mb-4 muted">AI와 대화하며 실시간으로 감정 상태를 분석하고 맞춤 케어를 받아보세요.</p>
                    <a th:href="@{/ai-care}" style="color: var(--primary); text-decoration: underline;">
                        AI 케어 시작하기 →
                    </a>
                </div>

                <div style="background: rgba(108,92,231,0.05); border: 1px solid rgba(108,92,231,0.2); border-radius: 0.5rem; padding: 1rem;">
                    <h4 class="mb-2">개인화된 콘텐츠 추천</h4>
                    <p class="mb-4 muted">검사 결과를 바탕으로 맞춤 도서, 활동, 커뮤니티를 추천해드립니다.</p>
                    <!-- TODO: 설문 팀과 emotion 값 포맷 협의 후 매핑 확정 필요 -->
                    <a th:href="@{/recommendations(emotion=${test.id == 'depression' ? 'DEPRESSION' : test.id == 'anxiety' ? 'ANXIETY' : test.id == 'stress' ? 'STRESS' : test.id == 'burnout' ? 'LETHARGY' : 'NORMAL'})}"
                       style="color: var(--primary); text-decoration: underline;">
                        추천 콘텐츠 보기 →
                    </a>
                </div>
            </div>

            <div class="flex gap-4">
                <a th:href="@{/self-assessment}" class="btn btn-outline" style="flex: 1;">다른 검사 하기</a>
                <a th:href="@{/self-assessment/{id}(id=${test.id})}" class="btn btn-primary" style="flex: 1;">다시 검사하기</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
