<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/counselor-layout :: head('마음이음 상담사 대시보드')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/admin.css}"/>

<div class="admin-layout">
    <aside th:replace="~{fragments/counselor-layout :: sidebar('dashboard')}"></aside>

    <div class="admin-main">
        <div class="admin-page-header">
            <h1>상담사 대시보드</h1>
            <p class="muted">마음이음 회원의 정서 상태를 모니터링하고 관리합니다.</p>
        </div>

        <div th:if="${flash}" class="alert alert-info" th:text="${flash}"></div>

        <!-- 통계 카드 -->
        <div class="admin-stat-grid">
            <div class="admin-stat-card">
                <div class="admin-stat-value" th:text="${totalUsers}">0</div>
                <div class="admin-stat-label">전체 회원</div>
                <div class="admin-stat-sub">일반 사용자 수</div>
            </div>
            <div class="admin-stat-card" style="border-left: 3px solid var(--destructive);">
                <div class="admin-stat-value" style="color: var(--destructive);"
                     th:text="${highRiskCount}">0</div>
                <div class="admin-stat-label">고위험도 판정</div>
                <div class="admin-stat-sub">누적 고위험 검사 수</div>
            </div>
            <div class="admin-stat-card">
                <div class="admin-stat-value" th:text="${postCount}">0</div>
                <div class="admin-stat-label">전체 게시글</div>
                <div class="admin-stat-sub">커뮤니티 게시물</div>
            </div>
        </div>

        <!-- 빠른 메뉴 -->
        <div class="admin-cards" style="margin-top: 1.75rem;">
            <a th:href="@{/counselor/posts}" class="admin-card">
                <div class="admin-card-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16v12H5.17L4 17.17z"/>
                        <line x1="8" y1="9" x2="16" y2="9"/>
                        <line x1="8" y1="13" x2="13" y2="13"/>
                    </svg>
                </div>
                <h3>게시글 관리</h3>
                <p class="muted">커뮤니티 게시글 조회 및 부적절 게시글 삭제</p>
            </a>
            <a th:href="@{/counselor/high-risk}" class="admin-card">
                <div class="admin-card-icon"
                     style="background: rgba(193,68,68,0.1); color: var(--destructive);"
                     aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                </div>
                <h3>고위험도 관리</h3>
                <p class="muted">고위험 판정 회원 목록 조회 및 알림 발송</p>
            </a>
            <a th:href="@{/counselor/alerts}" class="admin-card">
                <div class="admin-card-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </div>
                <h3>알림 발송</h3>
                <p class="muted">전체 또는 개별 회원에게 알림 메시지 발송</p>
            </a>
        </div>

        <!-- 최근 고위험도 결과 -->
        <div style="margin-top: 2rem;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
                <h2 style="margin:0; font-size:1.1rem;">최근 고위험도 검사 결과</h2>
                <a th:href="@{/counselor/high-risk}" class="btn btn-primary btn-sm">전체 보기</a>
            </div>

            <div th:if="${#lists.isEmpty(recentHighRisk)}" class="muted"
                 style="padding:1rem 0; font-size:0.9rem;">
                고위험도 판정 결과가 없습니다.
            </div>

            <div th:unless="${#lists.isEmpty(recentHighRisk)}" class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>회원</th>
                        <th>검사 유형</th>
                        <th class="num">점수</th>
                        <th>등급</th>
                        <th>검사일</th>
                        <th>조치</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${recentHighRisk}">
                        <td th:text="${r.user.name}">홍길동</td>
                        <td>
                            <span class="tag tag-secondary" th:text="${r.typeName}">검사</span>
                        </td>
                        <td class="num" th:text="${r.score != null ? r.score : '-'}">0</td>
                        <td>
                            <span class="tag"
                                  style="background:rgba(193,68,68,0.12); color:var(--destructive);"
                                  th:text="${r.level}">고위험</span>
                        </td>
                        <td class="muted" style="font-size:0.82rem;"
                            th:text="${#temporals.format(r.completedAt, 'MM-dd HH:mm')}">05-23</td>
                        <td>
                            <a th:href="@{/counselor/high-risk}" class="btn btn-secondary btn-sm">
                                알림 발송
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
