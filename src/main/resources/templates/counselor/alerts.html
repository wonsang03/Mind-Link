<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/counselor-layout :: head('마음이음 상담사 - 알림 발송')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/admin.css}"/>

<div class="admin-layout">
    <aside th:replace="~{fragments/counselor-layout :: sidebar('alerts')}"></aside>

    <div class="admin-main">
        <div class="admin-page-header">
            <h1>알림 발송</h1>
            <p class="muted">회원 알림함에 메시지를 직접 발송합니다.</p>
        </div>

        <div th:if="${flash}" class="alert alert-info" th:text="${flash}"></div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem; align-items:start; max-width:56rem;">

            <!-- 발송 폼 -->
            <div class="card" style="padding:1.5rem;">
                <h2 style="font-size:1rem; font-weight:700; margin:0 0 1.25rem;">메시지 작성</h2>
                <form th:action="@{/counselor/alerts}" method="post" id="counselorAlertForm"
                      style="display:flex; flex-direction:column; gap:1rem;">
                    <div>
                        <label class="admin-field-label">수신 대상</label>
                        <select name="userId" id="userSelect" class="form-input" onchange="updatePreview()">
                            <option value="">전체 회원 (관리자 제외)</option>
                            <option th:each="u : ${users}"
                                    th:value="${u.id}"
                                    th:text="|${u.name} (${u.email})|"
                                    th:attr="data-role=${u.role}">회원</option>
                        </select>
                    </div>
                    <div>
                        <label class="admin-field-label">제목 <span class="muted" style="font-weight:400;">(선택)</span></label>
                        <input type="text" name="title" id="msgTitle" class="form-input" maxlength="200"
                               placeholder="알림함에 표시할 제목" oninput="updatePreview()"/>
                    </div>
                    <div>
                        <label class="admin-field-label">알림 내용</label>
                        <textarea name="message" id="msgBody" rows="5" class="form-textarea" required
                                  placeholder="회원에게 보여질 본문 내용" oninput="updatePreview()"></textarea>
                    </div>
                    <div>
                        <label class="admin-field-label"
                               style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
                            <input type="checkbox" name="includeLink" value="true"
                                   id="includeLinkCheck" style="width:auto; margin:0;"
                                   onchange="syncLink()"/>
                            바로가기 링크 포함
                        </label>
                        <input type="text" name="linkUrl" id="counselorLinkUrl" class="form-input"
                               placeholder="예: /community/1 또는 /notice/2"
                               disabled style="margin-top:0.5rem;"
                               oninput="updatePreview()"/>
                        <p class="muted" style="font-size:0.82rem; margin:0.35rem 0 0;">
                            체크 해제 시 링크 없이 제목·내용만 표시됩니다.
                        </p>
                    </div>
                    <button type="submit" class="btn btn-primary">알림 보내기</button>
                </form>
            </div>

            <!-- 미리보기 패널 -->
            <div>
                <h2 style="font-size:1rem; font-weight:700; margin:0 0 1rem; color:var(--muted-foreground);">
                    미리보기
                </h2>
                <div id="previewCard"
                     style="background:var(--card); border:1px solid var(--border);
                            border-radius:var(--radius); padding:1.25rem; min-height:140px;">
                    <div style="display:flex; align-items:flex-start; gap:0.75rem;">
                        <div style="width:2rem; height:2rem; border-radius:50%;
                                    background:var(--secondary); color:var(--primary);
                                    display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                                 stroke-linecap="round" stroke-linejoin="round" style="width:1rem;height:1rem;">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                            </svg>
                        </div>
                        <div style="flex:1; min-width:0;">
                            <div id="pvTarget" style="font-size:0.78rem; color:var(--muted-foreground); margin-bottom:0.35rem;">
                                수신 대상: 전체 회원
                            </div>
                            <div id="pvTitle"
                                 style="font-weight:700; font-size:0.95rem; margin-bottom:0.3rem; color:var(--foreground); display:none;">
                            </div>
                            <div id="pvBody"
                                 style="font-size:0.88rem; color:var(--muted-foreground); white-space:pre-wrap;">
                                알림 내용이 여기에 표시됩니다.
                            </div>
                            <div id="pvLink"
                                 style="margin-top:0.6rem; font-size:0.82rem; color:var(--primary); display:none;">
                                🔗 <span id="pvLinkText"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="muted" style="font-size:0.8rem; margin:0.6rem 0 0;">
                    실제 알림함에서 표시되는 형태와 유사합니다.
                </p>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    syncLink();
    updatePreview();
})();

function syncLink() {
    var cb = document.getElementById('includeLinkCheck');
    var inp = document.getElementById('counselorLinkUrl');
    if (!cb || !inp) return;
    inp.disabled = !cb.checked;
    if (!cb.checked) { inp.value = ''; }
    updatePreview();
}

function updatePreview() {
    var sel = document.getElementById('userSelect');
    var titleVal = (document.getElementById('msgTitle').value || '').trim();
    var bodyVal = (document.getElementById('msgBody').value || '').trim();
    var linkCb = document.getElementById('includeLinkCheck');
    var linkVal = (document.getElementById('counselorLinkUrl').value || '').trim();

    // 수신 대상
    var targetText = '전체 회원';
    if (sel && sel.value) {
        var opt = sel.options[sel.selectedIndex];
        targetText = opt.text;
    }
    document.getElementById('pvTarget').textContent = '수신 대상: ' + targetText;

    // 제목
    var pvTitle = document.getElementById('pvTitle');
    if (titleVal) {
        pvTitle.textContent = titleVal;
        pvTitle.style.display = '';
    } else {
        pvTitle.style.display = 'none';
    }

    // 본문
    document.getElementById('pvBody').textContent = bodyVal || '알림 내용이 여기에 표시됩니다.';

    // 링크
    var pvLink = document.getElementById('pvLink');
    var pvLinkText = document.getElementById('pvLinkText');
    if (linkCb && linkCb.checked && linkVal) {
        pvLinkText.textContent = linkVal;
        pvLink.style.display = '';
    } else {
        pvLink.style.display = 'none';
    }
}
</script>
</body>
</html>
