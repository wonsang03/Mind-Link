<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 유저 상세')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page-narrow">
        <a th:href="@{${backUrl}}" class="btn-back">← 목록으로</a>

        <div th:if="${flash}" class="alert alert-info" th:text="${flash}"></div>

        <div class="flex-between mb-6" style="align-items:flex-start;">
            <div>
                <h1 class="mb-2" th:text="${user.name}">홍길동</h1>
                <p class="muted" th:text="${user.email}">a@b.com</p>
            </div>
            <span class="role-pill" th:classappend="'role-' + ${user.role.name()}"
                  th:text="${user.role}">USER</span>
        </div>

        <!-- 자가진단 이력 -->
        <section class="mb-8">
            <div class="flex-between mb-4">
                <h2>자가진단 이력</h2>
                <span class="tag tag-muted" th:text="|${#lists.size(assessments)}건|">0건</span>
            </div>
            <div th:if="${#lists.isEmpty(assessments)}" class="empty-note">자가진단 기록이 없습니다.</div>
            <div th:unless="${#lists.isEmpty(assessments)}" class="table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr><th>검사</th><th class="num">점수</th><th>결과</th><th>위험</th><th>일시</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${assessments}">
                        <td th:text="${a.typeName}">우울(PHQ-9)</td>
                        <td class="num" th:text="${a.score}">0</td>
                        <td th:text="${a.level}">정상</td>
                        <td>
                            <span th:if="${a.highRisk}" class="risk-badge">고위험</span>
                            <span th:unless="${a.highRisk}" class="muted">-</span>
                        </td>
                        <td class="muted" style="font-size:0.82rem;"
                            th:text="${#temporals.format(a.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 게시물 -->
        <section class="mb-8">
            <div class="flex-between mb-4">
                <h2>작성 게시물</h2>
                <span class="tag tag-muted" th:text="|${#lists.size(posts)}건|">0건</span>
            </div>
            <p class="muted mb-4" style="font-size:0.82rem;">작성자 이름 기준으로 매칭합니다.</p>
            <div th:if="${#lists.isEmpty(posts)}" class="empty-note">작성한 게시물이 없습니다.</div>
            <div th:unless="${#lists.isEmpty(posts)}" style="display:flex; flex-direction:column; gap:0.6rem;">
                <div th:each="p : ${posts}" class="card" style="padding:1rem 1.25rem;">
                    <div class="flex-between mb-2">
                        <span class="tag tag-secondary" th:text="${p.category}">고민</span>
                        <span class="muted" style="font-size:0.82rem;"
                              th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23</span>
                    </div>
                    <h3 class="mb-2" th:text="${p.title}">제목</h3>
                    <div class="flex gap-2">
                        <a th:href="@{/community/{id}(id=${p.id})}" class="btn btn-outline btn-sm">보기</a>
                        <th:block th:if="${canEdit}">
                            <a th:href="@{/admin/posts/{id}/edit(id=${p.id})}" class="btn btn-secondary btn-sm">수정</a>
                            <form th:action="@{/admin/posts/{id}/delete(id=${p.id})}" method="post"
                                  onsubmit="return confirm('이 게시글을 삭제하시겠습니까?');" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </div>
        </section>

        <!-- 상담 예약 이력 -->
        <section>
            <div class="flex-between mb-4">
                <h2>상담 예약 이력</h2>
                <span class="tag tag-muted" th:text="|${#lists.size(bookings)}건|">0건</span>
            </div>
            <div th:if="${#lists.isEmpty(bookings)}" class="empty-note">상담 예약 이력이 없습니다.</div>
            <div th:unless="${#lists.isEmpty(bookings)}" class="table-wrap">
                <table class="admin-table">
                    <thead>
                    <tr><th>상담소</th><th>일시</th><th>유형</th><th>상태</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="b : ${bookings}">
                        <td th:text="${b.centerName}">○○ 심리상담센터</td>
                        <td th:text="|${b.date} ${b.time}|">2026-05-23 14:00</td>
                        <td th:text="${b.type} ?: '-'">대면</td>
                        <td th:text="${b.status}">REQUESTED</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
