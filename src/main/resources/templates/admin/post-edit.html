<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 게시글 수정')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page-form" style="max-width: 42rem;">
        <a th:href="@{/admin/posts}" class="btn-back">← 게시글 목록</a>
        <h1 class="mb-6">게시글 수정</h1>

        <form th:action="@{/admin/posts/{id}/edit(id=${post.id})}" method="post" class="card">
            <div class="form-group">
                <label>제목</label>
                <input class="form-input" type="text" name="title" th:value="${post.title}" required/>
            </div>
            <div class="form-group">
                <label>분류</label>
                <input class="form-input" type="text" name="category" th:value="${post.category}" required/>
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea class="form-textarea" name="content" rows="12" required
                          th:text="${post.content}"></textarea>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary">저장</button>
                <a th:href="@{/admin/posts}" class="btn btn-outline">취소</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
