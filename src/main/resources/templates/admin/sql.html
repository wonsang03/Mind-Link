<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - SQL 콘솔')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page-narrow">
        <div class="mb-8">
            <div class="badge"><span>관리자 전용</span></div>
            <h1 class="mb-2">SQL 콘솔</h1>
            <p class="muted">DB를 직접 조회·수정합니다.</p>
        </div>

        <nav th:replace="~{fragments/layout :: adminNav('sql')}"></nav>

        <div class="alert alert-error mb-6">
            <strong>⚠ 주의</strong>
            <p style="font-size:0.88rem; margin-top:0.35rem;">
                입력한 SQL이 운영 DB에 그대로 실행됩니다. UPDATE/DELETE/DROP 등은 되돌릴 수 없으니 신중히 사용하세요.
                한 번에 하나의 문장만 실행됩니다. SELECT 결과는 최대 500행까지 표시됩니다.
            </p>
        </div>

        <form th:action="@{/admin/sql}" method="post" class="mb-6">
            <textarea class="sql-area" name="sql" th:text="${sql}"
                      placeholder="SELECT * FROM users ORDER BY id"></textarea>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"
                        onclick="return confirm('입력한 SQL을 실행하시겠습니까?');">실행</button>
            </div>
        </form>

        <!-- 실행 결과 -->
        <section th:if="${result != null}">
            <h2 class="mb-4">실행 결과</h2>

            <div th:if="${result.error != null}" class="alert alert-error">
                <strong>오류</strong>
                <p style="font-size:0.88rem; margin-top:0.35rem; white-space:pre-wrap;" th:text="${result.error}">에러 메시지</p>
            </div>

            <div th:if="${result.error == null and !result.query}" class="alert alert-info">
                <span th:text="|실행 완료 — 영향받은 행: ${result.updateCount}|">실행 완료 — 영향받은 행: 0</span>
            </div>

            <div th:if="${result.error == null and result.query}">
                <p class="muted mb-2" style="font-size:0.85rem;">
                    <span th:text="|${#lists.size(result.rows)}행|">0행</span>
                    <span th:if="${result.truncated}"> (500행까지만 표시)</span>
                </p>
                <div th:if="${#lists.isEmpty(result.rows)}" class="empty-note">조회된 행이 없습니다.</div>
                <div th:unless="${#lists.isEmpty(result.rows)}" class="table-wrap">
                    <table class="admin-table">
                        <thead>
                        <tr><th th:each="col : ${result.columns}" th:text="${col}">컬럼</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${result.rows}">
                            <td th:each="cell : ${row}" th:text="${cell} ?: 'NULL'"
                                th:classappend="${cell == null} ? 'muted'">값</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
