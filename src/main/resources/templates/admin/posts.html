<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('마음이음 - 게시글 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="page-narrow">
        <div class="mb-8">
            <div class="badge"><span>관리자 전용</span></div>
            <h1 class="mb-2">게시글 관리</h1>
            <p class="muted">모든 커뮤니티 게시글을 조회하고 수정·삭제합니다.</p>
        </div>

        <nav th:replace="~{fragments/layout :: adminNav('posts')}"></nav>

        <div th:if="${flash}" class="alert alert-info" th:text="${flash}"></div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty-note">등록된 게시글이 없습니다.</div>

        <div th:unless="${#lists.isEmpty(posts)}" class="table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th class="num">ID</th><th>제목</th><th>분류</th><th>작성자</th>
                    <th class="num">좋아요</th><th>작성일</th><th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${posts}">
                    <td class="num" th:text="${p.id}">1</td>
                    <td>
                        <a th:href="@{/community/{id}(id=${p.id})}" th:text="${p.title}"
                           style="color:var(--primary);">제목</a>
                    </td>
                    <td><span class="tag tag-secondary" th:text="${p.category}">고민</span></td>
                    <td th:text="${p.author}">홍길동</td>
                    <td class="num" th:text="${p.likes}">0</td>
                    <td class="muted" style="font-size:0.82rem;"
                        th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}">2026-05-23</td>
                    <td>
                        <div class="flex gap-2">
                            <a th:href="@{/admin/posts/{id}/edit(id=${p.id})}" class="btn btn-secondary btn-sm">수정</a>
                            <form th:action="@{/admin/posts/{id}/delete(id=${p.id})}" method="post"
                                  onsubmit="return confirm('이 게시글을 삭제하시겠습니까?');" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
