<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('마음이음 관리자 - 알림 발송')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/admin.css}"/>

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-layout :: sidebar('alerts')}"></aside>

    <div class="admin-main">
        <div class="admin-page-header">
            <h1>알림 발송</h1>
            <p class="muted">공지사항 게시판과 별도로 회원 알림함에 메시지를 보냅니다.</p>
        </div>

        <div th:if="${flash}" class="alert alert-info" th:text="${flash}"></div>

        <div class="card" style="max-width: 36rem; padding: 1.5rem;">
            <form th:action="@{/admin/alerts}" method="post" id="adminAlertForm"
                  style="display:flex; flex-direction:column; gap:1rem;">
                <div>
                    <label class="admin-field-label">수신 대상</label>
                    <select name="userId" class="form-input">
                        <option value="">전체 회원 (관리자 제외)</option>
                        <option th:each="u : ${users}" th:value="${u.id}"
                                th:text="|${u.name} (${u.email}) · ${u.role}|">회원</option>
                    </select>
                </div>
                <div>
                    <label class="admin-field-label">제목 (선택)</label>
                    <input type="text" name="title" class="form-input" maxlength="200"
                           placeholder="알림함에 표시할 제목"/>
                </div>
                <div>
                    <label class="admin-field-label">알림 내용</label>
                    <textarea name="message" rows="4" class="form-textarea" required
                              placeholder="회원에게 보여질 본문 내용"></textarea>
                </div>
                <div>
                    <label class="admin-field-label" style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
                        <input type="checkbox" name="includeLink" value="true" id="includeLinkCheck"
                               style="width:auto; margin:0;"/>
                        바로가기 링크 넣기
                    </label>
                    <input type="text" name="linkUrl" id="adminLinkUrl" class="form-input"
                           placeholder="예: /community/1 또는 /notice/2"
                           disabled style="margin-top:0.5rem;"/>
                    <p class="muted" style="font-size:0.82rem; margin:0.35rem 0 0;">
                        체크하지 않으면 링크 없이 제목·내용만 표시됩니다.
                    </p>
                </div>
                <button type="submit" class="btn btn-primary">알림 보내기</button>
            </form>
        </div>
    </div>
</div>

<script>
(function () {
    var cb = document.getElementById('includeLinkCheck');
    var inp = document.getElementById('adminLinkUrl');
    if (!cb || !inp) return;
    function sync() {
        inp.disabled = !cb.checked;
        if (!cb.checked) inp.value = '';
    }
    cb.addEventListener('change', sync);
    sync();
})();
</script>
</body>
</html>
