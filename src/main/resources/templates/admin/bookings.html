<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('마음이음 관리자 - 예약 관리')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/admin.css}"/>

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-layout :: sidebar('bookings')}"></aside>

    <div class="admin-main">
        <div class="admin-page-header">
            <h1>예약 관리</h1>
            <p class="muted">모든 상담 예약을 조회하고 진행 상태를 변경합니다.</p>
        </div>

        <div th:if="${flash}" class="alert alert-info" th:text="${flash}"></div>

        <!-- 상태 필터 -->
        <div class="admin-table-wrap" style="margin-bottom:1rem; display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center;">
            <a th:href="@{/admin/bookings}" class="btn btn-sm"
               th:classappend="${selectedStatus == null} ? 'btn-primary' : 'btn-outline'">전체</a>
            <a th:each="s : ${statuses}"
               th:href="@{/admin/bookings(status=${s})}" class="btn btn-sm"
               th:classappend="${selectedStatus != null and selectedStatus == s} ? 'btn-primary' : 'btn-outline'"
               th:text="${s}">REQUESTED</a>
        </div>

        <div th:if="${#lists.isEmpty(bookings)}" class="muted" style="padding:2rem 0;">
            조건에 해당하는 예약이 없습니다.
        </div>

        <div th:unless="${#lists.isEmpty(bookings)}" class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th class="num">ID</th>
                    <th>상담소</th>
                    <th>예약자</th>
                    <th>연락처</th>
                    <th>예약 일시</th>
                    <th>유형</th>
                    <th>상태</th>
                    <th>담당 상담사</th>
                    <th>생성일</th>
                    <th>상태 변경</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td class="num" th:text="${b.id}">1</td>
                    <td th:text="${b.centerName}">센터</td>
                    <td>
                        <span th:text="${b.name}">홍길동</span>
                        <a th:if="${b.user != null}" th:href="@{/admin/users/{id}(id=${b.user.id})}"
                           class="muted" style="font-size:0.78rem; text-decoration:none; display:block;"
                           th:text="|회원 #${b.user.id}|">회원</a>
                        <span th:unless="${b.user != null}" class="muted" style="font-size:0.78rem;">비회원</span>
                    </td>
                    <td class="muted" style="font-size:0.82rem;" th:text="${b.phone}">010-0000-0000</td>
                    <td class="muted" th:text="|${b.date} ${b.time}|">2026-06-10 14:00</td>
                    <td th:text="${b.type != null ? b.type : '-'}">—</td>
                    <td>
                        <span class="tag tag-secondary" th:text="${b.status}">REQUESTED</span>
                    </td>
                    <td>
                        <span th:if="${b.counselor != null}" th:text="${b.counselor.name}">김상담</span>
                        <span th:unless="${b.counselor != null}" class="muted" style="font-size:0.82rem;">미배정</span>
                    </td>
                    <td class="muted" style="font-size:0.82rem;"
                        th:text="${#temporals.format(b.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-02</td>
                    <td>
                        <form th:action="@{/admin/bookings/{id}/status(id=${b.id})}" method="post"
                              style="display:flex; gap:0.35rem; align-items:center;">
                            <input type="hidden" name="filter"
                                   th:value="${selectedStatus != null ? selectedStatus.name() : ''}"/>
                            <select name="status" style="font-size:0.82rem; padding:0.25rem;">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                        th:selected="${s == b.status}">REQUESTED</option>
                            </select>
                            <button type="submit" class="btn btn-secondary btn-sm">변경</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
