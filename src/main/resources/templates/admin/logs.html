<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('마음이음 관리자 - 서버 로그')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/admin.css}"/>

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-layout :: sidebar('logs')}"></aside>

    <div class="admin-main">
        <div class="admin-page-header">
            <h1>서버 로그</h1>
            <p class="muted">로그 파일을 선택해 줄·레벨·파일별로 확인합니다. 활성 파일(mindlink.log)은 실시간 갱신됩니다.</p>
        </div>

        <div class="log-toolbar">
            <div class="log-toolbar-left">
                <span id="log-status" class="log-status log-status-connecting">연결 중…</span>
                <select id="log-file" class="log-filter-select" title="로그 파일 선택"></select>
                <select id="log-lines" class="log-filter-select" title="최근 N줄">
                    <option value="100">최근 100줄</option>
                    <option value="300" selected>최근 300줄</option>
                    <option value="500">최근 500줄</option>
                    <option value="1000">최근 1000줄</option>
                </select>
                <button type="button" id="log-refresh" class="btn btn-secondary btn-sm">새로고침</button>
            </div>
            <div class="log-toolbar-right">
                <select id="log-preset" class="log-filter-select" title="로그 종류">
                    <option value="">전체</option>
                    <option value="APP">앱</option>
                    <option value="ACCESS">HTTP 접근</option>
                </select>
                <input type="text" id="log-filter" class="log-filter" placeholder="필터 (대소문자 무시)"/>
                <select id="log-level-filter" class="log-filter-select">
                    <option value="">모든 레벨</option>
                    <option value="ERROR">ERROR</option>
                    <option value="WARN">WARN+</option>
                    <option value="INFO">INFO+</option>
                    <option value="DEBUG">DEBUG+</option>
                </select>
                <label class="log-checkbox"><input type="checkbox" id="log-autoscroll" checked/><span>자동 스크롤</span></label>
                <label class="log-checkbox"><input type="checkbox" id="log-pause"/><span>일시정지</span></label>
                <label class="log-checkbox"><input type="checkbox" id="log-wrap" checked/><span>줄바꿈</span></label>
                <label class="log-checkbox"><input type="checkbox" id="log-colorize" checked/><span>색상·열 분리</span></label>
                <label class="log-checkbox"><input type="checkbox" id="log-linenums"/><span>줄 번호</span></label>
                <label class="log-checkbox" title="같은 API를 짧은 시간에 여러 번 호출한 ACCESS 로그를 한 줄로 묶습니다"><input type="checkbox" id="log-merge-access" checked/><span>ACCESS 묶기</span></label>
                <button type="button" id="log-clear" class="btn btn-secondary btn-sm">화면 비우기</button>
                <button type="button" id="log-download" class="btn btn-secondary btn-sm">다운로드</button>
            </div>
        </div>

        <div id="log-meta" class="log-meta"
             th:data-files-url="@{/admin/logs/files}"
             th:data-recent-url="@{/admin/logs/recent}"
             th:data-stream-url="@{/admin/logs/stream}">
            파일 정보를 불러오는 중…
        </div>

        <pre id="log-view" class="log-view"></pre>
    </div>
</div>

<script th:src="@{/js/admin-logs.js}"></script>
</body>
</html>
