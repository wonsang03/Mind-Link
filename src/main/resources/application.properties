spring.application.name=mind-link
server.port=8080

# ====== H2 (개발용 인메모리 DB - 기본값) ======
spring.datasource.url=jdbc:h2:mem:mindlink;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====== MySQL 사용 시: 위 H2 블록 주석 처리하고 아래 주석 해제 ======
# spring.datasource.url=jdbc:mysql://localhost:3306/mindlink?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD

# ====== JPA ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====== Thymeleaf (개발 시 캐시 비활성) ======
spring.thymeleaf.cache=false

# ====== 정적 리소스 캐시 비활성 (개발) ======
spring.web.resources.cache.period=0

# ====== 기본 데이터 시드 ======
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# ====== 네이버 지역검색 OpenAPI ======
# 발급 절차: https://developers.naver.com/apps/#/register (애플리케이션 등록 -> "검색" API 선택)
# 발급 후 아래 값에 입력하거나, 환경변수 NAVER_OPENAPI_CLIENT_ID / NAVER_OPENAPI_CLIENT_SECRET 로 주입.
# 키가 비어 있으면 상담센터 검색은 빈 결과 + 안내 메시지로 처리됩니다 (앱은 정상 기동).
naver.openapi.client-id=${NAVER_OPENAPI_CLIENT_ID:}
naver.openapi.client-secret=${NAVER_OPENAPI_CLIENT_SECRET:}
naver.openapi.local-search-url=https://openapi.naver.com/v1/search/local.json
# default-query는 NaverProperties.java의 Java 기본값("심리상담센터")을 사용 (properties 파일 인코딩 이슈 회피)
naver.openapi.display=20
