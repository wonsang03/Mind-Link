spring.application.name=demo
server.port=8081

# 프로젝트 루트 .env (Git 미포함, .env.example 참고)
spring.config.import=optional:file:.env[.properties]

# =====================================================
# Oracle DB — 값은 .env 에서 로드
# =====================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME:APP_USER}
spring.datasource.password=${DB_PASSWORD:}

# JPA (Oracle)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====== Thymeleaf (개발 시 캐시 비활성) ======
spring.thymeleaf.cache=false

# ====== 정적 리소스 캐시 비활성 (개발) ======
spring.web.resources.cache.period=0

# Oracle: 샘플 데이터는 sql/ORACLE_SETUP.sql 로 적재 (Spring data.sql 미사용)
spring.sql.init.mode=never

# 파일 업로드 (커뮤니티 첨부)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.dir=uploads

# Spring AI (자동 설정 비활성)
spring.ai.model.openai.enabled=false
spring.ai.vectorstore.oracle.enabled=false
spring.autoconfigure.exclude=\
org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
org.springframework.ai.vectorstore.oracle.autoconfigure.OracleVectorStoreAutoConfiguration

# =====================================================
# 네이버 도서 검색 API — 값은 .env (서상원 맞춤 추천)
# =====================================================
naver.api.client-id=${NAVER_API_CLIENT_ID:NOT_SET}
naver.api.client-secret=${NAVER_API_CLIENT_SECRET:NOT_SET}

# =====================================================
# 네이버 지역검색 OpenAPI (/v1/search/local.json) — 상담소 찾기
# .env 의 NAVER_API_* 와 동일 키 사용 가능 (네이버 앱에서「검색」API 사용 체크)
# =====================================================
naver.openapi.client-id=${NAVER_OPENAPI_CLIENT_ID:${NAVER_API_CLIENT_ID:}}
naver.openapi.client-secret=${NAVER_OPENAPI_CLIENT_SECRET:${NAVER_API_CLIENT_SECRET:}}
naver.openapi.local-search-url=https://openapi.naver.com/v1/search/local.json
naver.openapi.display=20

# =====================================================
# Google Gemini API — 도서 추천 전용 (BookRecommendationFeature)
# =====================================================
gemini.api.key=${GEMINI_API_KEY:NOT_SET}
# Gemini 모델 (할당량은 모델·프로젝트별). 429 시 care 편지는 fallback 모델을 순서대로 시도
gemini.model=gemini-2.0-flash
gemini.model.fallback=gemini-2.5-flash,gemini-1.5-flash-8b

# =====================================================
# OpenAI API — AI 종합 보고서(위로 편지) 전용 (gpt-4o-mini)
# =====================================================
openai.api.key=${OPENAI_API_KEY:OPENAI_KEY_NOT_SET}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini
openai.timeout.seconds=120

# =====================================================
# AI 종합 보고서 (서상원)
# =====================================================
# LLM: openai(.env OPENAI_API_KEY) | gemini(.env GEMINI_API_KEY)
care.llm.provider=${CARE_LLM_PROVIDER:openai}
care-report.daily-limit=3
